name: Clinic Flow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clinic-flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 测试、类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 单元测试
        run: bunx vitest run

      - name: TypeScript 类型检查
        run: bunx tsc --noEmit

      - name: 生产构建
        run: bun run build
